plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.sentry:sentry:8.61.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
    }
}

application {
    mainClass = 'Main'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('run') {
    systemProperty 'java.library.path', projectDir.absolutePath
    jvmArgs '-Xms32m', '-Xmx32m', '-Xcheck:jni'
}